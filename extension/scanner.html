<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhishGuard — Scan Before You Pay</title>
<script src="libs/jsqr.min.js"></script>
<style>
  body {
    margin: 0;
    background: #0b0f1a;
    color: #e5e7eb;
    font-family: sans-serif;
    text-align: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: #9ca3af; font-size: 0.85rem; margin-top: 0; margin-bottom: 16px; }
  #videoWrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }
  video {
    width: 100%;
    border-radius: 12px;
    background: #000;
    display: block;
  }
  #debug {
    margin-top: 10px;
    font-size: 0.72rem;
    color: #6b7280;
    text-align: left;
    background: #0d1220;
    padding: 8px;
    border-radius: 8px;
    max-width: 420px;
    margin: 10px auto;
  }
  #status { margin-top: 12px; color: #9ca3af; font-size: 0.9rem; }
  #result {
    max-width: 420px;
    margin: 16px auto;
    padding: 16px;
    border-radius: 12px;
    display: none;
    text-align: left;
  }
  .danger { background: #3b1616; border: 1px solid #f87171; color: #f87171; }
  .safe { background: #12271f; border: 1px solid #34d399; color: #34d399; }
  .warn { background: #332a12; border: 1px solid #fbbf24; color: #fbbf24; }
  #result p { margin: 6px 0; font-size: 0.9rem; word-break: break-all; }
  button {
    margin-top: 12px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>🛡️ Scan Before You Pay</h1>
<p class="sub">PhishGuard UPI Intent Shield</p>

<div id="videoWrap">
  <video id="video" playsinline muted autoplay></video>
</div>

<div id="status">Starting camera...</div>
<div id="debug">Waiting for camera...</div>
<div id="result"></div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="scanner.js"></script>
</body>
</html>
